spring:
  datasource:
    # Aquí definimos el nombre de la BD como 'syscomadb'
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    # Muestra las consultas SQL en la consola de IntelliJ
    show-sql: true
    hibernate:
      ddl-auto: create
    database-platform: org.hibernate.dialect.H2Dialect



